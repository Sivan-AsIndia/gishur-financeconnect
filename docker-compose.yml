# ============================================================
# docker-compose.yml - GishurFinanceConnect v5.0.0
# ============================================================
# Usage: docker compose up -d
# Access: https://localhost:5002
# ============================================================

services:
  # ── Web API ────────────────────────────────────────────────
  api:
    image: sivan67906/gishurfinance-api:v5.0.0
    container_name: GishurFinanceConnect-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__AuthDb=Data Source=/app/data/FinanceConnectDB.db
      - ClientSettings__BaseUrl=https://localhost:5002
    volumes:
      - finance-db-data:/app/data
    networks:
      - gishur-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/swagger/index.html"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Blazor WASM Client (nginx) ────────────────────────────
  client:
    image: sivan67906/gishurfinance-client:v5.0.0
    container_name: GishurFinanceConnect
    restart: unless-stopped
    ports:
      - "5002:443"
      - "5001:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gishur-network

# ── Persistent storage for SQLite database ───────────────────
volumes:
  finance-db-data:
    driver: local

# ── Internal network ─────────────────────────────────────────
networks:
  gishur-network:
    driver: bridge
