# ============================================================
# nginx.conf - Blazor WASM + API Reverse Proxy (HTTPS)
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Gzip compression for Blazor WASM (significantly reduces load time)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        image/svg+xml;

    # ── HTTPS Server ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        # Self-signed certificate (generated in Dockerfile)
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        # ── Reverse Proxy: API calls → API container ─────────
        location /api/ {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ── Reverse Proxy: Swagger UI → API container ───────
        location /swagger {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Blazor WASM framework files (with caching) ──────
        location /_framework/ {
            gzip_static on;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Static assets ────────────────────────────────────
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public";
        }

        # ── Blazor WASM SPA fallback ────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────
    # ── HTTP Server (same as HTTPS but without SSL) ──────────
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /swagger {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /_framework/ {
            gzip_static on;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
